<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periscope · mark the tape</title>
<meta name="theme-color" content="#0a0c10">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0c10; --panel: #11141a; --panel-2: #161a22; --well: #07090c; --line: #20252f; --line-2: #2c3340;
    --ink: #eceff4; --ink-2: #b3bac7; --ink-3: #8a93a3; --accent: #9b97ff; --accent-2: #b9b6ff; --accent-ink: #110f2b; --mono: "Geist Mono", ui-monospace, monospace; }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(155,151,255,.34); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  a { color: var(--accent-2); text-underline-offset: 3px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 24px 64px; }
  h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.02em; font-weight: 600; }
  p { margin: 0 0 18px; color: var(--ink-2); max-width: 70ch; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .stage { position: relative; border-radius: 10px; overflow: hidden; background: var(--well); border: 1px solid var(--line); min-height: 280px; display: grid; place-items: center; }
  .stage canvas { display: block; max-width: 100%; height: auto; cursor: crosshair; }
  .drop { color: var(--ink-3); text-align: center; padding: 40px; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--well); margin-bottom: 12px; }
  .seg button { border: 0; background: transparent; color: var(--ink-3); font: 500 13px "Geist", sans-serif; height: 28px; padding: 0 10px; border-radius: 7px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); }
  ol { margin: 0 0 14px; padding: 0; list-style: none; }
  ol li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; color: var(--ink-3); }
  ol li.next { color: var(--ink); }
  ol li.done { color: var(--ink-2); }
  ol li span:last-child { font: 13px var(--mono); }
  ol li b { font: 500 13px var(--mono); color: var(--accent-2); }
  textarea { width: 100%; height: 86px; resize: vertical; background: var(--well); color: var(--ink); border: 1px solid var(--line-2); border-radius: 9px; padding: 10px; font: 13px var(--mono); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .btn { display: inline-flex; align-items: center; height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--ink); font: 600 14px "Geist", sans-serif; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  label.file { display: inline-flex; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  @media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } .wrap { padding: 14px 14px 48px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mark the tape</h1>
  <p>Load a frame (<code>first_frame.png</code> from <code>tools/calibrate.py --frame-only</code>), then click each tape mark in the order listed. Copy the mark string into <code>--marks</code> (corner camera) or <code>--gt-marks</code> (hidden-hallway camera). <a href="./">Back to the console</a>.</p>
  <div class="grid">
    <div class="panel">
      <div class="stage" id="stage"><div class="drop" id="drop">No frame loaded yet.<br>Choose an image, or drop one here.</div><canvas id="cv" hidden></canvas></div>
    </div>
    <div class="panel">
      <div class="seg" role="group" aria-label="Which camera">
        <button type="button" aria-pressed="true" data-mode="corner">Corner camera</button>
        <button type="button" aria-pressed="false" data-mode="gt">Hidden hallway</button>
      </div>
      <ol id="list"></ol>
      <textarea id="out" readonly aria-label="Mark string"></textarea>
      <div class="row">
        <label class="btn file">Choose frame<input type="file" id="file" accept="image/*"></label>
        <button class="btn" id="undo" type="button">Undo</button>
        <button class="btn primary" id="copy" type="button" disabled>Copy marks</button>
      </div>
    </div>
  </div>
</div>
<script>
(() => {
  const MODES = {
    corner: [["1", "corner"], ["2", "wall, 50 cm"], ["3", "wall, 100 cm"], ["4", "90° line, 50 cm"], ["5", "90° line, 100 cm"], ["6", "diagonal (optional)"]],
    gt: [["A", "x −1, y 0.4"], ["B", "x −1, y 1.6"], ["C", "x −5, y 0.4"], ["D", "x −5, y 1.6"]],
  };
  let mode = "corner", pts = [], img = null;
  const cv = document.getElementById("cv"), cx = cv.getContext("2d");
  function render() {
    const M = MODES[mode];
    document.getElementById("list").innerHTML = M.map(([k, d], i) =>
      `<li class="${i < pts.length ? "done" : i === pts.length ? "next" : ""}"><b>${k}</b><span>${d}</span><span>${pts[i] ? pts[i].map((v) => v.toFixed(0)).join(", ") : ""}</span></li>`).join("");
    const need = mode === "corner" ? 5 : 4;
    document.getElementById("out").value = pts.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
    document.getElementById("copy").disabled = pts.length < need;
    if (!img) return;
    cx.drawImage(img, 0, 0);
    const r = Math.max(5, img.width / 160);
    pts.forEach((p, i) => {
      cx.lineWidth = r / 2.5; cx.strokeStyle = "#9b97ff"; cx.fillStyle = "rgba(155,151,255,.25)";
      cx.beginPath(); cx.arc(p[0], p[1], r, 0, Math.PI * 2); cx.fill(); cx.stroke();
      cx.font = `600 ${r * 2.4}px Geist, sans-serif`; cx.fillStyle = "#fff"; cx.strokeStyle = "rgba(0,0,0,.7)"; cx.lineWidth = r / 2;
      cx.strokeText(MODES[mode][i][0], p[0] + r * 1.4, p[1] - r * 1.2); cx.fillText(MODES[mode][i][0], p[0] + r * 1.4, p[1] - r * 1.2);
    });
  }
  function loadFile(f) {
    if (!f || !f.type.startsWith("image/")) return;
    const im = new Image();
    im.onload = () => { img = im; cv.width = im.width; cv.height = im.height; cv.hidden = false; document.getElementById("drop").hidden = true; pts = []; render(); };
    im.src = URL.createObjectURL(f);
  }
  document.getElementById("file").onchange = (e) => loadFile(e.target.files[0]);
  const stage = document.getElementById("stage");
  stage.ondragover = (e) => e.preventDefault();
  stage.ondrop = (e) => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); };
  cv.onclick = (e) => {
    if (pts.length >= MODES[mode].length) return;
    const r = cv.getBoundingClientRect();
    pts.push([(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]); render();
  };
  document.getElementById("undo").onclick = () => { pts.pop(); render(); };
  document.getElementById("copy").onclick = async () => {
    const b = document.getElementById("copy");
    try { await navigator.clipboard.writeText(document.getElementById("out").value); b.textContent = "Copied"; }
    catch (_) { document.getElementById("out").select(); b.textContent = "Press ⌘C"; }
    setTimeout(() => (b.textContent = "Copy marks"), 1400);
  };
  document.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => {
    mode = b.dataset.mode; pts = [];
    document.querySelectorAll("[data-mode]").forEach((o) => o.setAttribute("aria-pressed", o === b)); render();
  });
  render();
})();
</script>
</body>
</html>
